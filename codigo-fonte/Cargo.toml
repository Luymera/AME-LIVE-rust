[package]
name = "ame-live"
version = "1.0.0"
edition = "2021"
description = "AME LIVE! OVERDOSE - servidor de salas, chat e chamadas"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

